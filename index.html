<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Charter Schools Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    #header {
      padding: 12px 20px;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    #header h1 { margin: 0; font-size: 1.15rem; }
    .controls { display: flex; align-items: center; gap: 12px; }
    input, select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.9rem;
    }
    input::placeholder { color: #94a3b8; }
    #count { font-size: 0.9rem; color: #94a3b8; }
    #map { height: calc(100vh - 54px); width: 100%; }
  </style>
</head>
<body>
  <div id="header">
    <h1>NYC Charter Schools</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search school or neighborhood..." />
      <select id="boroughFilter">
        <option value="ALL">All Boroughs (227)</option>
        <option value="BROOKLYN">Brooklyn (87)</option>
        <option value="BRONX">Bronx (66)</option>
        <option value="MANHATTAN">Manhattan (51)</option>
        <option value="QUEENS">Queens (20)</option>
        <option value="STATEN IS">Staten Island (3)</option>
      </select>
      <span id="count">Loading schools...</span>
    </div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const map = L.map('map').setView([40.7128, -74.0060], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const BOROUGH_LABELS = {
      'BRONX': 'Bronx',
      'BROOKLYN': 'Brooklyn',
      'MANHATTAN': 'Manhattan',
      'QUEENS': 'Queens',
      'STATEN IS': 'Staten Island'
    };

    const BOROUGH_COLORS = {
      'BRONX': '#dc2626',
      'BROOKLYN': '#2563eb',
      'MANHATTAN': '#7c3aed',
      'QUEENS': '#059669',
      'STATEN IS': '#d97706'
    };

    let allSchools = [];
    const markersLayer = L.layerGroup().addTo(map);

    function renderMarkers() {
      const borough = document.getElementById('boroughFilter').value;
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      markersLayer.clearLayers();
      let plotted = 0;

      allSchools.forEach(row => {
        const lat = parseFloat(row['Latitude']);
        const lng = parseFloat(row['Longitude']);
        const rawBorough = (row['Borough'] || '').trim().toUpperCase();

        if (isNaN(lat) || isNaN(lng)) return;
        if (borough !== 'ALL' && rawBorough !== borough) return;

        const name = row['Location Name'] || 'Charter School';
        const neighborhood = row['NTA_Name'] || '';
        const address = row['Primary Address'] || '';

        if (query && !name.toLowerCase().includes(query) && !neighborhood.toLowerCase().includes(query) && !address.toLowerCase().includes(query)) {
          return;
        }

        plotted++;
        const zip = row['Zip'] || '';
        const grades = row['Grades Final'] || row['Grades'] || 'N/A';
        const dbn = row['ATS System Code'] || '';
        const displayBorough = BOROUGH_LABELS[rawBorough] || rawBorough;
        const color = BOROUGH_COLORS[rawBorough] || '#2563eb';

        L.circleMarker([lat, lng], {
          radius: 6.5,
          fillColor: color,
          color: '#ffffff',
          weight: 1.5,
          fillOpacity: 0.88
        })
        .bindPopup(
          `<strong>${name}</strong><br>` +
          `${address}, ${displayBorough} ${zip}<br>` +
          (neighborhood ? `Neighborhood: ${neighborhood}<br>` : '') +
          `Grades: ${grades}` +
          (dbn ? `<br><small style="color:#64748b;">DBN: ${dbn}</small>` : '')
        )
        .addTo(markersLayer);
      });

      document.getElementById('count').textContent = `${plotted} school${plotted === 1 ? '' : 's'} shown`;
    }

    Papa.parse('NYCCharterSchools.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allSchools = results.data;
        renderMarkers();
      }
    });

    document.getElementById('boroughFilter').addEventListener('change', renderMarkers);
    document.getElementById('searchInput').addEventListener('input', renderMarkers);
  </script>
</body>
</html>
